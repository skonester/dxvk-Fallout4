name: Build

on: [push, pull_request, workflow_dispatch]

permissions:
  contents: write

jobs:
  build-standard:
    name: Standard (D3D11/DXGI)
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup glslangValidator
      shell: pwsh
      run: |
        Invoke-WebRequest -Uri "https://raw.githubusercontent.com/HansKristian-Work/vkd3d-proton-ci/main/glslangValidator.exe" -OutFile "glslangValidator.exe"
        Write-Output "$pwd" | Out-File -FilePath "${Env:GITHUB_PATH}" -Append

    - name: Setup Meson
      shell: pwsh
      run: pip install meson

    - name: Get version
      shell: bash
      run: echo "VERSION_NAME=${GITHUB_REF##*/}-${GITHUB_SHA::8}" >> $GITHUB_ENV

    - name: Build
      shell: pwsh
      run: .\build_dx11.ps1

    - name: Prepare artifacts
      shell: pwsh
      run: |
        mkdir artifacts\x64
        Get-ChildItem -Path build_clang\src -Include *.dll,*.pdb -Recurse | Copy-Item -Destination (Join-Path -Path (pwd) -ChildPath artifacts\x64)

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dxvk-fo4-${{ env.VERSION_NAME }}-standard
        path: artifacts\*

  build-experimental-simd:
    name: Experimental (AVX2/FMA SIMD)
    runs-on: windows-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Setup glslangValidator
      shell: pwsh
      run: |
        Invoke-WebRequest -Uri "https://raw.githubusercontent.com/HansKristian-Work/vkd3d-proton-ci/main/glslangValidator.exe" -OutFile "glslangValidator.exe"
        Write-Output "$pwd" | Out-File -FilePath "${Env:GITHUB_PATH}" -Append

    - name: Setup Meson
      shell: pwsh
      run: pip install meson

    - name: Get version
      shell: bash
      run: echo "VERSION_NAME=${GITHUB_REF##*/}-${GITHUB_SHA::8}" >> $GITHUB_ENV

    - name: Build
      shell: pwsh
      env:
        DXVK_EXPERIMENTAL_SIMD: "1"
        DXVK_BUILD_DIR: "build_clang_simd"
      run: .\build_dx11.ps1

    - name: Prepare artifacts
      shell: pwsh
      run: |
        mkdir artifacts\x64
        Get-ChildItem -Path build_clang_simd\src -Include *.dll,*.pdb -Recurse | Copy-Item -Destination (Join-Path -Path (pwd) -ChildPath artifacts\x64)

    - name: Upload artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dxvk-fo4-${{ env.VERSION_NAME }}-experimental-simd
        path: artifacts\*

  publish-draft-release:
    name: Publish Draft Release
    needs: [build-standard, build-experimental-simd]
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
    - name: Download standard artifact
      uses: actions/download-artifact@v4
      with:
        pattern: dxvk-fo4-*-standard
        path: standard
        merge-multiple: true

    - name: Download experimental SIMD artifact
      uses: actions/download-artifact@v4
      with:
        pattern: dxvk-fo4-*-experimental-simd
        path: experimental-simd
        merge-multiple: true

    - name: Package release assets
      run: |
        cd standard && zip -r ../dxvk-fo4-standard.zip x64 && cd ..
        cd experimental-simd && zip -r ../dxvk-fo4-experimental-simd.zip x64 && cd ..

    - name: Publish draft release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: latest-build
        name: "Latest build (master)"
        target_commitish: ${{ github.sha }}
        draft: true
        body: |
          Automated draft build from commit ${{ github.sha }} on `master`.

          - `dxvk-fo4-standard.zip` -- default build (frame governor + FO4FSRUpscaler patches)
          - `dxvk-fo4-experimental-simd.zip` -- opt-in AVX2/FMA SIMD build

          This draft is overwritten on every push to master. Review and publish manually when ready.
        files: |
          dxvk-fo4-standard.zip
          dxvk-fo4-experimental-simd.zip
